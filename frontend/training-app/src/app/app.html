<mat-toolbar
  class="sticky top-0 z-50 h-16! border-b border-slate-200 bg-white/80 backdrop-blur-md shadow-sm"
>
  <div class="flex items-center gap-3">
    <div
      class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-md"
    >
      <mat-icon>pets</mat-icon>
    </div>
    <span class="text-xl font-bold tracking-tight text-slate-800">Dog Gallery</span>
  </div>
  <nav class="ml-10 flex gap-2">
    <a
      mat-button
      routerLink="/home"
      routerLinkActive="!bg-indigo-100 !text-indigo-700"
      [routerLinkActiveOptions]="{ exact: true }"
      class="rounded-lg"
    >
      <mat-icon>home</mat-icon>
      Home
    </a>
  </nav>
  <span class="flex-1"></span>
  @if (authService.isAuthenticated() && authService.user(); as user) {
    <div class="flex items-center gap-4">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-full bg-indigo-600 text-lg font-bold text-white shadow"
      >
        {{ user.username.charAt(0).toUpperCase() }}
      </div>
      <div class="hidden flex-col md:flex">
        <span class="text-sm font-semibold text-slate-800">
          {{ user.username | username }}
        </span>
        <span class="text-xs text-slate-500">
          {{ user.roles[0] }}
        </span>
      </div>
      <button
        mat-icon-button
        (click)="logout()"
        class="text-slate-600 hover:bg-red-50 hover:text-red-600"
      >
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  } @else {
    <button mat-raised-button color="primary" routerLink="/login" class="rounded-xl">
      <mat-icon>login</mat-icon>
      Login
    </button>
  }
  <button mat-icon-button class="ml-2 text-slate-600">
    <mat-icon>settings</mat-icon>
  </button>
</mat-toolbar>
<main class="min-h-screen bg-linear-to-br from-indigo-50 via-white to-blue-100 p-6 md:p-10">
  <router-outlet></router-outlet>
</main>
