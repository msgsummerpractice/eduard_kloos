<mat-toolbar color="primary" class="fixed-top-0 left-0 w-full z50">
  <span>Dog gallery</span>
  <nav class="ml-8 flex gap-2">
    <a
      mat-button
      routerLink="/home"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Home
    </a>

    <a mat-button routerLink="/login" routerLinkActive="active-link"> Login </a>
  </nav>

  <span class="flex-1"></span>

  <div *appAuthOnly>
    <button mat-icon-button aria-label="Login">
      <mat-icon>person</mat-icon>
    </button>
  </div>
  <button mat-icon-button aria-label="Settings">
    <mat-icon>settings</mat-icon>
  </button>
</mat-toolbar>

<main class="p-6 md:p-10">
  <router-outlet></router-outlet>
</main>
