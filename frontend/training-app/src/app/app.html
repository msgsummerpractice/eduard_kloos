<mat-toolbar color="primary" class="fixed top-0 left-0 w-full z-50">
  <span>Dog gallery</span>
  <nav class="ml-8 flex gap-2">
    <a
      mat-button
      routerLink="/home"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Home
    </a>
  </nav>

  <span class="flex-1"></span>

  @if (authService.user(); as user) {
    <div class="flex items-center gap-3">
      <span
        class="flex items-center px-4 py-1 rounded-full bg-white/10 border border-white/30 text-sm font-medium"
      >
        {{ user.username | username }}
      </span>

      <button mat-button class="text-white" (click)="logout()">Logout</button>
    </div>
  } @else {
    <a mat-button routerLink="/login" routerLinkActive="active-link"> Login </a>
  }
  <button mat-icon-button aria-label="Settings">
    <mat-icon>settings</mat-icon>
  </button>
</mat-toolbar>

<main class="p-6 md:p-10">
  <router-outlet></router-outlet>
</main>
